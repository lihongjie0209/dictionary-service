apiVersion: v1
kind: Secret
metadata:
  name: dictionary-service
  namespace: platform
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=dictionary
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=dictionary
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  APP_AUTH_PSK_KEY: replace-with-at-least-32-random-bytes
  APP_PROVIDER_CLIENT_PSK: replace-with-the-provider-psk
